name: Release APK

# Buduje Słownik z repozytorium dictionary-app i publikuje APK
# jako release w tym repozytorium.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release'u, np. v21.0"
        required: true
      source_ref:
        description: "Gałąź / tag / commit w dictionary-app"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: JacekWalczak92/dictionary-app
          ref: ${{ inputs.source_ref }}
          # dictionary-app jest prywatne - potrzebny token z dostępem do odczytu tego repo.
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK jest już na runnerze; doinstalowujemy tylko potrzebną platformę.
      - name: Android SDK 35
        run: |
          sdkm=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Przygotuj klucz do podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 - APK podpisane kluczem debug."
          fi

      - name: Zbuduj APK
        working-directory: src
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Opublikuj release
        env:
          GH_TOKEN: ${{ github.token }}
          # To repo nie jest checkoutowane, więc gh musi dostać je wprost.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          src_sha=$(git -C src rev-parse HEAD)
          apk="Slownik-${TAG}.apk"
          cp src/app/build/outputs/apk/release/app-release.apk "$apk"
          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
          notes="Zbudowane z dictionary-app@${src_sha::7}. Wymaga Androida 8.0+.

          SHA-256 APK: \`${apk_sha}\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "Słownik ${TAG}" --notes "$notes"
          fi
